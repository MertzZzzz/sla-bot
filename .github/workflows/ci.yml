name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: telegram_sla_bot
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_TELEGRAM__BOT_TOKEN: "123456:ci-token"
      APP_DATABASE__HOST: 127.0.0.1
      APP_DATABASE__USER: postgres
      APP_DATABASE__PASSWORD: postgres
      APP_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff format --check .
          ruff check .
      - name: Mypy
        run: mypy
      - name: Migrations apply on a clean database and match models
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: Tests
        run: pytest -q
