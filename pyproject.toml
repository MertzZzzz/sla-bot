[project]
name = "telegram-sla-bot"
version = "0.1.0"
description = "Telegram bot that monitors reply SLA in work chats and escalates overdue messages"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.13,<4",
    "aiohttp>=3.9",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "celery[redis]>=5.4,<6",
    "redis>=5",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "celery-types>=0.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "S", "PT", "RET", "TID", "TCH", "PL",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Cyrillic text in user-facing strings is intentional
    "PLR0913",                      # services/repositories legitimately take many keyword args
    "PLR2004",                      # magic values in comparisons
    "S101",                         # assert in tests
    "TC001", "TC002", "TC003",      # runtime imports needed by pydantic/sqlalchemy/aiogram DI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N802"]
"migrations/**" = ["N", "PLR"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["kombu.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: requires PostgreSQL (set APP_TEST_DATABASE_URL or the APP_DATABASE__* variables)",
]
filterwarnings = ["ignore::DeprecationWarning:celery.*"]
